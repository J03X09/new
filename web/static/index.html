<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Shorts Clipper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #00e676;
      --accent-dim: #00c853;
      --red: #ff5252;
      --text: #f0f0f0;
      --muted: #888;
      --card: #1a1a1a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 0 0 80px;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #0d1f0d 0%, #111 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header .logo { font-size: 32px; }
    header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
    header h1 span { color: var(--accent); }
    header .badge {
      margin-left: auto;
      background: var(--accent);
      color: #000;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    /* ── Layout ── */
    .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

    /* ── Input panel ── */
    .input-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      margin-top: 28px;
    }
    .input-panel h2 { font-size: 15px; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }

    .url-row { display: flex; gap: 10px; }
    .url-row input {
      flex: 1;
      background: #111;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 13px 16px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .url-row input:focus { border-color: var(--accent); }
    .url-row input::placeholder { color: var(--muted); }

    .btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 13px 26px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover { background: var(--accent-dim); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }
    .btn.secondary {
      background: #222;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn.secondary:hover { background: #2a2a2a; }

    /* Settings row */
    .settings {
      display: flex;
      gap: 12px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .setting-group { display: flex; flex-direction: column; gap: 5px; min-width: 110px; }
    .setting-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
    .setting-group select {
      background: #111;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .setting-group select:focus { border-color: var(--accent); }

    /* Batch area */
    .batch-area {
      display: none;
      margin-top: 14px;
    }
    .batch-area textarea {
      width: 100%;
      background: #111;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      font-size: 13px;
      font-family: monospace;
      resize: vertical;
      min-height: 90px;
      outline: none;
    }
    .batch-area textarea:focus { border-color: var(--accent); }

    .mode-tabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .tab {
      background: #111;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 8px;
      padding: 7px 16px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }

    /* ── Jobs list ── */
    #jobs-section { margin-top: 36px; }
    #jobs-section h2 { font-size: 15px; color: var(--muted); margin-bottom: 16px; text-transform: uppercase; letter-spacing: 1px; }

    .job-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 20px;
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .job-card.done { border-color: #1a3a1a; }
    .job-card.error { border-color: #3a1a1a; }

    .job-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }
    .job-status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-running { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    .dot-done { background: var(--accent); }
    .dot-error { background: var(--red); }
    .dot-queued { background: #555; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .job-title { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job-meta { font-size: 12px; color: var(--muted); }
    .job-chevron { color: var(--muted); transition: transform 0.2s; font-size: 18px; }
    .job-card.expanded .job-chevron { transform: rotate(180deg); }

    .job-body { display: none; padding: 16px 20px 20px; }
    .job-card.expanded .job-body { display: block; }

    /* Progress bar */
    .progress-wrap { margin-bottom: 12px; }
    .progress-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .progress-bar { height: 6px; background: #222; border-radius: 3px; overflow: hidden; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-dim));
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    /* Steps */
    .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .step-pill {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }
    .step-pill.active { background: var(--accent); color: #000; }
    .step-pill.done { background: #1a3a1a; color: var(--accent); }
    .step-pill.pending { background: #222; color: var(--muted); }

    /* Error message */
    .error-msg {
      background: #1a0000;
      border: 1px solid #3a1a1a;
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      color: var(--red);
      margin-bottom: 12px;
    }

    /* ── Clips grid ── */
    .clips-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .clip-card {
      background: #111;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .clip-thumb {
      width: 100%;
      aspect-ratio: 9/16;
      object-fit: cover;
      background: #0a0a0a;
      display: block;
      max-height: 180px;
    }
    .clip-thumb-placeholder {
      width: 100%;
      height: 180px;
      background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    .clip-info { padding: 14px; }
    .clip-num {
      font-size: 10px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .clip-title { font-size: 13px; font-weight: 600; margin: 4px 0 6px; line-height: 1.35; }
    .clip-caption {
      display: inline-block;
      background: var(--accent);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .clip-stats { font-size: 11px; color: var(--muted); display: flex; gap: 12px; margin-bottom: 12px; }
    .clip-download {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--accent);
      color: #000;
      text-decoration: none;
      border-radius: 8px;
      padding: 9px;
      font-size: 13px;
      font-weight: 700;
      transition: background 0.15s;
    }
    .clip-download:hover { background: var(--accent-dim); }

    /* ── Empty state ── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty .emoji { font-size: 48px; display: block; margin-bottom: 12px; }
    .empty p { font-size: 14px; }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--accent);
      color: #000;
      padding: 11px 22px;
      border-radius: 24px;
      font-weight: 700;
      font-size: 13px;
      transition: transform 0.3s;
      z-index: 999;
      pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      .input-panel { padding: 18px; }
      .url-row { flex-direction: column; }
      .clips-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

          <option value="medium">Medium (accurate)</option>

    </div>
  </div>

  <!-- Jobs section -->

    <h2>Processing Jobs</h2>
    <div id="jobs-list"></div>
  </div>

  <!-- Empty state -->
  <div class="empty" id="empty-state">
    <span class="emoji">🎬</span>
    <p>Paste a YouTube URL above to generate viral football Shorts</p>
  </div>

</div>

<div id="toast"></div>

  // ── Helpers ────────────────────────────────────────────────────────────────
  function escHtml(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function formatDur(s) {
    const m = Math.floor(s/60);
    return m ? `${m}m ${Math.round(s%60)}s` : `${Math.round(s)}s`;
  }
  function stepIndex(p) {
    for (let i=STEP_THRESHOLDS.length-1;i>=0;i--)
      if(p>=STEP_THRESHOLDS[i]) return i;
    return 0;
  }
  function buildSteps(p) {
    const cur=stepIndex(p);
    return STEPS.map((s,i)=>{
      const cls=i<cur?'done':i===cur?'active':'pending';
      return `<span class="step-pill ${cls}">${i<cur?'✓ ':''}${s}</span>`;
    }).join('');
  }

  // Parse a YouTube URL into a display title
  function titleFromUrl(url) {
    try {
      const u = new URL(url);
      if (u.hostname.includes('youtube.com')) {
        const v = u.searchParams.get('v');
        return v ? `YouTube · ${v}` : u.hostname + u.pathname;
      }
      if (u.hostname.includes('youtu.be')) {
        return `YouTube · ${u.pathname.replace('/','')}`;
      }
      return u.hostname + u.pathname;
    } catch {
      return url.length > 55 ? url.slice(0,52)+'…' : url;
    }
  }

  // ── Mode tabs ──────────────────────────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      const mode = tab.dataset.mode;
      document.getElementById('single-mode').style.display = mode==='single'?'':'none';
      document.getElementById('batch-mode').style.display  = mode==='batch' ?'':'none';
    });
  });

  // ── Toast ──────────────────────────────────────────────────────────────────
  function toast(msg) {
    const el=document.getElementById('toast');
    el.textContent=msg; el.classList.add('show');
    setTimeout(()=>el.classList.remove('show'),3000);
  }

  // ── Clip card ──────────────────────────────────────────────────────────────
  function clipCard(c) {
    const dur = c.duration_s ?? c.duration ?? '?';
    const hasThumb = c.thumbnail_url && c.thumbnail_url !== '' && !c.thumbnail_url.endsWith('/');
    const thumb = hasThumb
      ? `<img class="clip-thumb" src="${escHtml(c.thumbnail_url)}" alt="" loading="lazy"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
      : '';
    const placeholder = `<div class="clip-thumb-placeholder" style="${hasThumb?'display:none':''}">⚽</div>`;

    const isDemo = c.download_url && c.download_url.startsWith('data:');
    const isReal = c.download_url && c.download_url.startsWith('/clips');
    const downloadAttr = (isDemo || isReal) ? `download="${escHtml(c.filename)}"` : '';
    const downloadHref = (isDemo || isReal) ? escHtml(c.download_url) : '#';
    const btnLabel = isReal ? 'Download Short' : isDemo ? 'Download (Demo)' : 'No file';
    const btnStyle = (!isDemo && !isReal) ? 'opacity:0.4;cursor:default;pointer-events:none' : '';

    return `
      <div class="clip-card">
        ${thumb}${placeholder}
        <div class="clip-info">
          <div class="clip-num">CLIP ${c.id}</div>
          <div class="clip-title">${escHtml(c.title)}</div>
          ${c.caption?`<span class="clip-caption">${escHtml(c.caption)}</span>`:''}
          <div class="clip-stats">
            <span>⏱ ${dur}s</span>
            <span>💾 ${c.size_mb} MB</span>
          </div>
          <a class="clip-download" href="${downloadHref}" ${downloadAttr} style="${btnStyle}">${btnLabel}</a>
        </div>
      </div>`;
  }

  // ── Job card render ────────────────────────────────────────────────────────
  function renderJob(jobId, state) {
    let card = document.getElementById(`job-${jobId}`);
    if (!card) {
      card = document.createElement('div');
      card.id = `job-${jobId}`;
      card.className = 'job-card expanded';
      card.innerHTML = `
        <div class="job-header">
          <div class="job-status-dot"></div>
          <div class="job-title" id="jtitle-${jobId}"></div>
          <div class="job-meta"  id="jmeta-${jobId}"></div>
          <div class="job-chevron">⌄</div>
        </div>
        <div class="job-body">
          <div class="progress-wrap">
            <div class="progress-label">
              <span id="jstep-${jobId}"></span>
              <span id="jpct-${jobId}">0%</span>
            </div>
            <div class="progress-bar">
              <div class="progress-fill" id="jbar-${jobId}" style="width:0%"></div>
            </div>
          </div>
          <div class="steps"     id="jsteps-${jobId}"></div>
          <div                   id="jerr-${jobId}"></div>
          <div class="clips-grid" id="jclips-${jobId}"></div>
        </div>`;
      card.querySelector('.job-header').addEventListener('click', ()=>card.classList.toggle('expanded'));
      document.getElementById('jobs-list').prepend(card);
    }

    const wasExpanded = card.classList.contains('expanded');
    const statusCls = state.status==='done'?'done':state.status==='error'?'error':'';
    card.className = ['job-card', statusCls, wasExpanded?'expanded':''].filter(Boolean).join(' ');
    card.querySelector('.job-status-dot').className = `job-status-dot dot-${state.status||'queued'}`;

    document.getElementById(`jtitle-${jobId}`).textContent = state.title || jobId;
    document.getElementById(`jmeta-${jobId}`).textContent  = state.duration ? formatDur(state.duration) : '';

    const pct = state.progress||0;
    document.getElementById(`jstep-${jobId}`).textContent  = state.step || '';
    document.getElementById(`jpct-${jobId}`).textContent   = `${pct}%`;
    document.getElementById(`jbar-${jobId}`).style.width   = `${pct}%`;
    document.getElementById(`jsteps-${jobId}`).innerHTML   = buildSteps(pct);

    const errEl = document.getElementById(`jerr-${jobId}`);
    errEl.innerHTML = state.error ? `<div class="error-msg">Error: ${escHtml(state.error)}</div>` : '';

    if (state.clips && state.clips.length > 0) {
      const clipsEl = document.getElementById(`jclips-${jobId}`);
      if (clipsEl.children.length !== state.clips.length)
        clipsEl.innerHTML = state.clips.map(clipCard).join('');
    }
  }

  // ── SSE subscription (live server) ────────────────────────────────────────
  function subscribeToJob(jobId) {
    const es = new EventSource(`/api/progress/${jobId}`);
    es.onmessage = evt => {
      const state = JSON.parse(evt.data);
      jobs[jobId] = state;
      renderJob(jobId, state);
      if (state.status === 'done') {
        toast(`${state.clips.length} clips ready — downloading!`);
        es.close();
        document.getElementById('process-btn').disabled = false;
      } else if (state.status === 'error') {
        toast('Processing failed — check server logs');
        es.close();
        document.getElementById('process-btn').disabled = false;
      }
    };
    es.onerror = () => es.close();
  }

  // ── Demo clips (built from the actual URL input) ───────────────────────────
  function buildDemoClips(url) {
    const vid = titleFromUrl(url);
    const labels = [
      ['INSANE GOAL',    'Stunning long-range strike'],
      ['SUPERHERO SAVE', 'Goalkeeper stops the penalty'],
      ['VAR CHAOS',      'Goal overturned by VAR review'],
      ['CONTROVERSIAL!', 'Red card changes the game'],
      ['WE WON!',        'Final whistle celebrations'],
    ];
    return labels.map(([ caption, desc ], i) => ({
      id: i+1,
      title: `${vid} — ${desc}`,
      caption,
      duration_s: [39,38,42,37,42][i],
      size_mb:    [22.4,20.1,24.8,19.3,23.7][i],
      filename:   `short_0${i+1}_${caption.replace(/[^a-z0-9]/gi,'_').toLowerCase()}.mp4`,
      thumbnail_url: '',
      download_url: DEMO_DATA_URLS[i],   // real downloadable MP4
    }));
  }

    p => ({ step: 'Transcribed 300+ commentary segments',        progress: 50 }),
    p => ({ step: 'AI identifying viral moments…',              progress: 55 }),
    p => ({ step: 'Found 5 viral moments',                      progress: 60 }),
    p => ({ step: 'Extracting & encoding clips (parallel)…',    progress: p }),
    p => ({ step: 'Extracting & encoding clips (parallel)…',    progress: p }),
    p => ({ step: 'Extracting & encoding clips (parallel)…',    progress: p }),
    p => ({ step: 'Generating thumbnails…',                     progress: 92 }),
    p => ({ step: 'Complete!',                                   progress:100, done:true }),
  ];
  const DEMO_PROGRESSES = [5,18,25,32,44,50,55,60,68,77,86,92,100];

  function runDemo(jobId, url) {
    const title = titleFromUrl(url);
    jobs[jobId] = { status:'running', step:'Starting…', progress:0, clips:[], title, duration:6420 };
    renderJob(jobId, jobs[jobId]);

    let i = 0;
    const demoClips = buildDemoClips(url);

    function tick() {
      if (i >= DEMO_STEP_TEMPLATES.length) return;
      const s = DEMO_STEP_TEMPLATES[i](DEMO_PROGRESSES[i]);
      i++;
      jobs[jobId].step     = s.step;
      jobs[jobId].progress = s.progress;

      if (s.done) {
        jobs[jobId].status = 'done';
        jobs[jobId].clips  = demoClips;
        renderJob(jobId, jobs[jobId]);
        document.getElementById('process-btn').disabled = false;
        toast('5 demo clips ready — click Download (Demo) on each!');
        return;
      }
      renderJob(jobId, jobs[jobId]);
      setTimeout(tick, i<=3 ? 900 : i<=8 ? 720 : 560);
    }
    setTimeout(tick, 350);
  }

  // ── Process single ─────────────────────────────────────────────────────────
  async function processVideo() {
    const url = document.getElementById('url-input').value.trim();
    if (!url) { toast('Please paste a YouTube URL first'); return; }

    const btn = document.getElementById('process-btn');
    btn.disabled = true;
    document.getElementById('jobs-section').style.display = '';
    document.getElementById('empty-state').style.display  = 'none';
    document.getElementById('url-input').value = '';

    if (IS_LOCAL) {
      runDemo(Math.random().toString(36).slice(2,10), url);
      return;
    }

    try {
      const res = await fetch('/api/process', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          url,
          num_clips: +document.getElementById('num-clips').value,
          quality:    document.getElementById('quality').value,
          model:      document.getElementById('model').value,
        }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const { job_id } = await res.json();
      subscribeToJob(job_id);
    } catch (err) {
      console.warn('Server unavailable, running demo:', err.message);
      runDemo(Math.random().toString(36).slice(2,10), url);
    }
  }

  // ── Process batch ──────────────────────────────────────────────────────────
  async function processBatch() {
    const raw  = document.getElementById('batch-urls').value.trim();
    const urls = raw.split('\n').map(u=>u.trim()).filter(u=>u.startsWith('http'));
    if (!urls.length) { toast('No valid URLs found'); return; }

    document.getElementById('jobs-section').style.display = '';
    document.getElementById('empty-state').style.display  = 'none';

    if (IS_LOCAL) {
      urls.forEach(u => runDemo(Math.random().toString(36).slice(2,10), u));
      document.getElementById('batch-urls').value = '';
      toast(`${urls.length} demo jobs started`);
      return;
    }

    try {
      const res = await fetch('/api/batch', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          urls,
          num_clips: +document.getElementById('num-clips').value,
          quality:    document.getElementById('quality').value,
          model:      document.getElementById('model').value,
        }),
      });
      const { job_ids } = await res.json();
      job_ids.forEach(subscribeToJob);
      document.getElementById('batch-urls').value = '';
      toast(`${job_ids.length} jobs started`);
    } catch {
      urls.forEach(u => runDemo(Math.random().toString(36).slice(2,10), u));
      toast(`${urls.length} demo jobs started`);
    }
  }

  document.getElementById('url-input').addEventListener('keydown', e => {
    if (e.key==='Enter') processVideo();
  });
</script>
</body>
